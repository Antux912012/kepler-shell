[package]
name = "kepler-shell"
version = "0.1.0"
edition = "2024"
authors = ["Antonio"]
description = "A Fluent / Windows 11 inspired Shell for Linux written in Rust, GTK4 and Libadwaita"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
gtk4-layer-shell = "0.8"
tokio = { version = "1.40", features = ["full"] }
zbus = { version = "5.5", features = ["tokio"] }
async-channel = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "8.0"
chrono = "0.4"
futures-util = "0.3"
gio = { version = "0.22", features = ["v2_76"] }
glib = "0.22"
libc = "0.2"
